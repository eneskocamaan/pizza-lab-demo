<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pizza Lab · Pizzanı sen tasarla</title>
  <meta name="description" content="Masadan aç, hamurdan malzemeye pizzanı kendin tasarla. İnteraktif pizza atölyesi demosu.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pizza Lab · Pizzanı sen tasarla">
  <meta property="og:description" content="Masadan aç, hamurdan malzemeye pizzanı kendin tasarla. İnteraktif pizza atölyesi demosu.">
  <meta property="og:url" content="https://eneskocamaan.github.io/pizza-lab-demo/">
  <meta property="og:image" content="https://eneskocamaan.github.io/pizza-lab-demo/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23dda04b'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23cf3a22'/%3E%3Ccircle cx='24' cy='26' r='5' fill='%23fbf4df'/%3E%3Ccircle cx='40' cy='38' r='6' fill='%23fbf4df'/%3E%3Ccircle cx='38' cy='22' r='4' fill='%238a2112'/%3E%3Ccircle cx='24' cy='40' r='4' fill='%238a2112'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- Açılış -->
  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="splash-art">
        <div class="orbit" id="orbit" aria-hidden="true"></div>
        <svg class="splash-pizza" id="splashPizza" viewBox="0 0 400 400" aria-hidden="true"></svg>
      </div>
      <p class="eyebrow">Masa 7'ye hoş geldin</p>
      <h1>Pizzanı<br><em>sen tasarla.</em></h1>
      <p class="splash-sub">Hamurdan malzemeye her şey senin elinde. Fırını biz yakıyoruz.</p>
      <button class="btn primary" id="start">
        Atölyeye gir
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <small class="splash-note">Yaklaşık 1 dakika · Üyelik yok · Uygulama yok</small>
    </div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <span class="brand-mark">PL</span>
        <div>
          <strong>Pizza Lab</strong>
          <small>Atölye · Masa 7</small>
        </div>
      </div>
      <div class="price-pill" id="pricePill">
        <span>Toplam</span>
        <strong id="price">₺0</strong>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Adımlar"></nav>

    <section class="stage" id="stage">
      <div class="glow" aria-hidden="true"></div>
      <div class="board" id="board">
        <div class="ring" aria-hidden="true"></div>
        <span class="size-tag" id="sizeTag">32 cm</span>
        <div class="turn" id="turn">
          <svg id="pizza" viewBox="0 0 400 400" aria-label="Pizza önizleme">
            <defs>
              <radialGradient id="gCrust" cx="50%" cy="50%" r="50%">
                <stop offset="78%" id="cs0"/>
                <stop offset="86%" id="cs1"/>
                <stop offset="93%" id="cs2"/>
              </radialGradient>
              <radialGradient id="gSheen" cx="34%" cy="28%" r="62%">
                <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </radialGradient>
              <filter id="melt" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/>
                <feDisplacementMap in="SourceGraphic" scale="13" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
              <clipPath id="sauceClip"><circle id="sauceClipC" cx="200" cy="200" r="0"/></clipPath>
              <clipPath id="innerClip"><circle id="innerClipC" cx="200" cy="200" r="160"/></clipPath>
            </defs>
            <path id="crust" fill="url(#gCrust)"/>
            <g id="rimSpots"></g>
            <path id="base"/>
            <g clip-path="url(#sauceClip)"><g id="sauce"></g></g>
            <g clip-path="url(#innerClip)"><g id="cheese" filter="url(#melt)"></g></g>
            <g id="toppings" class="toppings-layer"></g>
            <circle cx="200" cy="200" r="186" fill="url(#gSheen)" pointer-events="none"/>
          </svg>
        </div>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="sheet" id="sheet">
      <div class="sheet-head">
        <span class="step-no" id="stepNo">01</span>
        <div>
          <h2 id="stepTitle"></h2>
          <p id="stepSub"></p>
        </div>
      </div>
      <div class="options" id="options"></div>
      <div class="summary" id="summary"></div>
      <div class="bar">
        <button class="btn ghost icon" id="back" aria-label="Geri">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <button class="btn primary" id="next">
          <span id="nextLabel">Devam</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Fırın -->
  <div class="oven" id="oven" hidden>
    <div class="oven-dome">
      <div class="oven-mouth">
        <div class="fire"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="oven-pizza" id="ovenPizza"></div>
      </div>
    </div>
    <p class="oven-msg" id="ovenMsg"></p>
    <div class="oven-bar"><span id="ovenBar"></span></div>
    <div class="oven-temp"><strong id="ovenTemp">20</strong> °C</div>
  </div>

  <!-- Sonuç -->
  <div class="result" id="result" hidden>
    <div class="result-card">
      <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="result-pizza" id="resultPizza"></div>
      <p class="eyebrow">Masa 7 · Fırından yeni çıktı</p>
      <h2 id="resultName"></h2>
      <div class="share-badge" id="shareBadge">Topluluk Favorileri'nde paylaşılacak</div>
      <ul class="result-list" id="resultList"></ul>
      <div class="result-price"><span>Toplam</span><strong id="resultPrice"></strong></div>
      <div class="result-actions">
        <button class="btn ghost" id="saveBtn">Kaydet</button>
        <button class="btn primary" id="cartBtn">Sepete ekle</button>
      </div>
      <button class="link" id="restart">Yeni bir pizza tasarla</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
