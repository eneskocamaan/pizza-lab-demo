<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lezzet Atölyesi · Kendi lezzetini tasarla</title>
  <meta name="description" content="Masadan aç; pizzanı, burgerini, waffle'ını, kumpirini, dondurmanı ya da bowl'unu kendin tasarla. İnteraktif sipariş deneyimi demosu.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lezzet Atölyesi · Kendi lezzetini tasarla">
  <meta property="og:description" content="Pizza, burger, waffle, kumpir, dondurma, bowl. Masadan aç, kendin tasarla.">
  <meta property="og:url" content="https://eneskocamaan.github.io/pizza-lab-demo/">
  <meta property="og:image" content="https://eneskocamaan.github.io/pizza-lab-demo/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23dda04b'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23cf3a22'/%3E%3Ccircle cx='24' cy='26' r='5' fill='%23fbf4df'/%3E%3Ccircle cx='40' cy='38' r='6' fill='%23fbf4df'/%3E%3Ccircle cx='38' cy='22' r='4' fill='%238a2112'/%3E%3Ccircle cx='24' cy='40' r='4' fill='%238a2112'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tüm ürünlerin paylaştığı SVG tanımları -->
  <svg class="defs-host" aria-hidden="true" focusable="false">
    <defs id="sharedDefs">
      <radialGradient id="sheen" cx="34%" cy="28%" r="62%">
        <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <filter id="pieceShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#000" flood-opacity=".45"/>
      </filter>
      <filter id="melt" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/>
        <feDisplacementMap in="SourceGraphic" scale="13" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="grain" aria-hidden="true"></div>

  <!-- Köşedeki küçük atölye butonu -->
  <button class="corner-switch" id="cornerSwitch" aria-label="Diğer atölyeler">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="2"/><rect x="9" y="1" width="6" height="6" rx="3"/><rect x="1" y="9" width="6" height="6" rx="3"/><rect x="9" y="9" width="6" height="6" rx="2"/></svg>
  </button>

  <!-- Açılış -->
  <div class="splash" id="splash">
    <div class="splash-inner play">
      <div class="splash-art" id="splashArt">
        <div class="orbit" id="orbit" aria-hidden="true"></div>
      </div>
      <p class="eyebrow">Masa 7'ye hoş geldin</p>
      <h1><span id="splashT1"></span><br><em id="splashT2"></em></h1>
      <p class="splash-sub" id="splashSub"></p>
      <button class="btn primary" id="start">
        Atölyeye gir
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <small class="splash-note">Yaklaşık 1 dakika · Üyelik yok · Uygulama yok</small>
    </div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" id="brandMark">PL</span>
        <div>
          <strong id="brandName">Pizza Lab</strong>
          <small>Atölye · Masa 7</small>
        </div>
      </div>
      <div class="price-pill" id="pricePill">
        <span>Toplam</span>
        <strong id="price">₺0</strong>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Adımlar"></nav>

    <section class="stage" id="stage">
      <div class="glow" aria-hidden="true"></div>
      <div class="board" id="board">
        <div class="ring" aria-hidden="true"></div>
        <span class="size-tag" id="sizeTag"></span>
        <div class="turn" id="turn">
          <svg id="stageSvg" viewBox="0 0 400 400" aria-label="Ürün önizleme"></svg>
        </div>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="sheet" id="sheet">
      <div class="sheet-head">
        <span class="step-no" id="stepNo">01</span>
        <div>
          <h2 id="stepTitle"></h2>
          <p id="stepSub"></p>
        </div>
      </div>
      <div class="options" id="options"></div>
      <div class="summary" id="summary"></div>
      <div class="bar">
        <button class="btn ghost icon" id="back" aria-label="Geri">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <button class="btn primary" id="next">
          <span id="nextLabel">Devam</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Hazırlama sahneleri -->
  <div class="cook" id="cook" hidden>
    <div class="scene scene-oven">
      <div class="oven-dome">
        <div class="oven-mouth">
          <div class="fire"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="item"></div>
        </div>
      </div>
    </div>
    <div class="scene scene-grill">
      <div class="smoke"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="item"></div>
      <div class="grate"></div>
      <div class="flames"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="scene scene-iron">
      <div class="iron-base"></div>
      <div class="item"></div>
      <div class="iron-lid"><span></span></div>
      <div class="iron-steam"><i></i><i></i><i></i></div>
    </div>
    <div class="scene scene-frost">
      <div class="snow"></div>
      <div class="frost-ring"></div>
      <div class="item"></div>
    </div>
    <div class="scene scene-fresh">
      <div class="rays"></div>
      <div class="item"></div>
      <div class="sparkles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <p class="cook-msg" id="cookMsg"></p>
    <div class="cook-bar"><span id="cookBar"></span></div>
    <div class="cook-meter"><strong id="cookVal">20</strong> <span id="cookUnit">°C</span></div>
  </div>

  <!-- Sonuç -->
  <div class="result" id="result" hidden>
    <div class="result-card">
      <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="result-pizza" id="resultPizza"></div>
      <p class="eyebrow" id="resultEyebrow">Masa 7</p>
      <h2 id="resultName"></h2>
      <div class="share-badge" id="shareBadge">Topluluk Favorileri'nde paylaşılacak</div>
      <ul class="result-list" id="resultList"></ul>
      <div class="result-price"><span>Toplam</span><strong id="resultPrice"></strong></div>
      <div class="result-actions">
        <button class="btn ghost" id="saveBtn">Kaydet</button>
        <button class="btn primary" id="cartBtn">Sepete ekle</button>
      </div>
      <button class="link" id="restart">Yeniden tasarla</button>
    </div>
  </div>

  <!-- Atölye menüsü -->
  <div class="menu" id="menu" hidden>
    <div class="menu-backdrop" data-close></div>
    <div class="menu-panel" role="dialog" aria-label="Atölyeler">
      <div class="menu-head">
        <div>
          <p class="eyebrow">Tek link · Tüm atölyeler</p>
          <h3>Bugün ne tasarlıyoruz?</h3>
        </div>
        <button class="menu-x" data-close aria-label="Kapat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="menu-grid" id="menuGrid"></div>
      <p class="menu-soon"><span>Yakında</span> Smoothie · Tost · Kahve · Dürüm</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/core.js"></script>
  <script src="js/products/pizza.js"></script>
  <script src="js/products/burger.js"></script>
  <script src="js/products/waffle.js"></script>
  <script src="js/products/kumpir.js"></script>
  <script src="js/products/dondurma.js"></script>
  <script src="js/products/bowl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
